ekf_filter_node:
  ros__parameters:
    frequency: 4.0
    sensor_timeout: 0.25 # 1.0 / frequency
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    publish_tf: true
    publish_acceleration: false
    two_d_mode: true # Overrides template default, forces 2D mode

    # --- Frame Parameters ---
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom # Since we are fusing odometry/IMU/GPS to get the map->odom transform

    # --- Input 1: Odometry (from navsat_transform_node) ---
    # The topic name is /odometry/gps, published by the navsat_transform_node
    odom0: odometry/gps
    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 5
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

    # --- Input 2: IMU (Heading from u-blox/GPS) ---
    # The topic name is /gps/navheading (from your u-blox topic list)
    imu0: gps/navheading
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 5
    imu0_remove_gravitational_acceleration: false # Irrelevant since we use only yaw
